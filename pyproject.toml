[build-system]
requires = ["setuptools==83.0.0", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "protcross"
version = "0.2.2"
description = "Domain-adaptive protein point-cloud binding-site prediction."
readme = "README.md"
requires-python = ">=3.10,<3.11"
license = "MIT"
authors = [
  { name = "Shuyu Zhong" },
  { name = "Yuying Jiang" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "biopython>=1.87,<1.88",
  "hydra-core>=1.3,<1.4",
  "numpy>=1.26,<3.0",
  "pandas>=2.2,<2.4",
  "pytorch-lightning>=2.2,<2.7",
  "requests>=2.34,<3",
  "scikit-learn>=1.4,<1.8",
  "torch>=2.3,<2.4",
  "torch-geometric>=2.5,<2.8",
  "torchmetrics>=1.3,<1.9",
  "tqdm>=4.66,<5",
]

[project.optional-dependencies]
esm = ["esm>=3.1.0,<3.3", "httpx>=0.27,<0.29", "torchvision>=0.18,<0.19", "torchtext>=0.18,<0.19"]
predict = ["esm>=3.1.0,<3.3", "httpx>=0.27,<0.29", "torchvision>=0.18,<0.19", "torchtext>=0.18,<0.19"]
test = ["pytest>=8,<10"]
dev = ["pytest>=8,<10", "build>=1.2,<1.5", "twine>=5,<7", "ruff>=0.11,<1"]

[project.urls]
Publication = "https://doi.org/10.1021/acs.jcim.5c03224"
Documentation = "https://github.com/GeraltZeroZhong/ProtCross/blob/v0.2.2/README.md"
Repository = "https://github.com/GeraltZeroZhong/ProtCross"
Issues = "https://github.com/GeraltZeroZhong/ProtCross/issues"

[project.scripts]
protcross-predict = "protcross.cli.predict:main"
protcross-inspect = "protcross.cli.inspect:main"
protcross-setup-assets = "protcross.cli.setup_assets:main"
protcross-preprocess = "protcross.cli.preprocess:main"
protcross-train = "protcross.cli.train:main"
protcross = "protcross.cli.main:main"
protcross-download-af2 = "protcross.cli.download_af2:main"
protcross-map-labels = "protcross.cli.map_labels:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"protcross.configs" = ["*.yaml", "data/*.yaml", "model/*.yaml", "trainer/*.yaml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "slow: integration tests that require large model weights or substantial runtime",
  "network: tests that intentionally open local or remote sockets",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "protcross-desktop-backend"
version = "0.2.1"
description = "Local sidecar backend for ProtCross Desktop."
readme = { text = "Local sidecar backend for the ProtCross Desktop 0.2.1 prediction workflow.", content-type = "text/plain" }
requires-python = ">=3.10,<3.11"
dependencies = [
  "protcross==0.2.1"
]

[project.scripts]
protcross-desktop-backend = "protcross_desktop.server:main"

[tool.setuptools.packages.find]
where = ["."]

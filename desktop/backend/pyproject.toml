[build-system]
requires = ["setuptools==83.0.0", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "protcross-desktop-backend"
version = "0.2.3"
description = "Local sidecar backend for ProtCross Desktop."
readme = { text = "Local sidecar backend for the ProtCross Desktop prediction workflow.", content-type = "text/plain" }
requires-python = ">=3.10,<3.11"
dependencies = [
  "protcross==0.2.3"
]

[project.scripts]
protcross-desktop-backend = "protcross_desktop.server:main"

[tool.setuptools.packages.find]
where = ["."]

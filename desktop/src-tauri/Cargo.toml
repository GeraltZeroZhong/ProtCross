[package]
name = "protcross-desktop"
version = "0.2.3"
description = "ProtCross Desktop for Windows and macOS"
authors = ["ProtCross contributors"]
license = "MIT"
repository = "https://github.com/GeraltZeroZhong/ProtCross"
edition = "2021"

[lib]
name = "protcross_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
getrandom = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "=2.11.4", features = [] }
tauri-plugin-dialog = "=2.7.1"

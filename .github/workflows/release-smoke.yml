name: Release Smoke

on:
  workflow_dispatch:
    inputs:
      checkpoint_url:
        description: "URL for the release checkpoint .ckpt"
        required: true
      checkpoint_sha256:
        description: "Expected SHA256 for the release checkpoint .ckpt"
        required: true
      sample_url:
        description: "URL for a preprocessed sample .pt"
        required: true
      sample_sha256:
        description: "Expected SHA256 for the preprocessed sample .pt"
        required: true

jobs:
  checkpoint-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"

      - name: Install test environment
        run: |
          python -m pip install --upgrade "pip==26.0.1"
          python -m pip install -c constraints/py310-ci.txt -e ".[test]"

      - name: Download release fixtures
        run: |
          mkdir -p /tmp/protcross-release-smoke/data/processed_pdb /tmp/protcross-release-smoke/checkpoints
          python - <<'PY'
          import hashlib
          import os
          import urllib.request

          fixtures = {
              os.environ["CHECKPOINT_URL"]: (
                  "/tmp/protcross-release-smoke/checkpoints/release.ckpt",
                  os.environ["CHECKPOINT_SHA256"],
              ),
              os.environ["SAMPLE_URL"]: (
                  "/tmp/protcross-release-smoke/data/processed_pdb/6fhu.pt",
                  os.environ["SAMPLE_SHA256"],
              ),
          }
          for url, (path, expected_sha256) in fixtures.items():
              urllib.request.urlretrieve(url, path)
              digest = hashlib.sha256()
              with open(path, "rb") as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                      digest.update(chunk)
              actual = digest.hexdigest()
              if actual.lower() != expected_sha256.strip().lower():
                  raise SystemExit(f"SHA256 mismatch for {url}: expected {expected_sha256}, got {actual}")
          PY
        env:
          CHECKPOINT_URL: ${{ inputs.checkpoint_url }}
          CHECKPOINT_SHA256: ${{ inputs.checkpoint_sha256 }}
          SAMPLE_URL: ${{ inputs.sample_url }}
          SAMPLE_SHA256: ${{ inputs.sample_sha256 }}

      - name: Run checkpoint forward smoke
        run: |
          PROTCROSS_RELEASE_SMOKE=1 \
          PROTCROSS_RELEASE_CHECKPOINT=/tmp/protcross-release-smoke/checkpoints/release.ckpt \
          PROTCROSS_PUBLISH_ROOT=/tmp/protcross-release-smoke \
          pytest -q tests/test_checkpoint_smoke.py

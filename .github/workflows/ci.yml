name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade "pip==26.0.1"
          python -m pip install -c constraints/py310-ci.txt -e ".[dev,test]"

      - name: Run tests
        run: pytest -q -m "not slow"

      - name: Static analysis
        run: python -m ruff check src tests desktop/backend desktop/installer

      - name: CLI help smoke
        run: |
          protcross --help
          protcross inspect --help
          protcross predict --help
          protcross setup-assets --help
          protcross preprocess --help
          protcross download-af2 --help
          protcross map-labels --help
          protcross train --help

      - name: Build distributions
        run: python -m build

      - name: Check distributions
        run: python -m twine check dist/*

      - name: Clean install smoke
        run: |
          python -m venv /tmp/protcross-smoke
          /tmp/protcross-smoke/bin/python -m pip install --upgrade "pip==26.0.1"
          /tmp/protcross-smoke/bin/python -m pip install -c constraints/py310-ci.txt dist/*.whl
          /tmp/protcross-smoke/bin/python -c "import protcross; print(protcross.__version__)"
          /tmp/protcross-smoke/bin/protcross --help
          /tmp/protcross-smoke/bin/protcross inspect --help

      - name: Clean predict-extra install smoke
        run: |
          python -m venv /tmp/protcross-predict-smoke
          /tmp/protcross-predict-smoke/bin/python -m pip install --upgrade "pip==26.0.1"
          wheel="$(ls dist/*.whl)"
          /tmp/protcross-predict-smoke/bin/python -m pip install -c constraints/py310-ci.txt "${wheel}[predict]"
          /tmp/protcross-predict-smoke/bin/protcross predict --help

  no-deps-help:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"

      - name: Install package without runtime dependencies
        run: |
          python -m pip install --upgrade "pip==26.0.1"
          python -m pip install --no-deps .

      - name: CLI help without torch or Lightning
        run: |
          protcross --help
          protcross inspect --help
          protcross predict --help
          protcross setup-assets --help
          protcross preprocess --help
          protcross download-af2 --help
          protcross map-labels --help
          protcross train --help

  release-checkpoint-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"

      - name: Install test environment
        run: |
          python -m pip install --upgrade "pip==26.0.1"
          python -m pip install -c constraints/py310-ci.txt -e ".[test]"

      - name: Download verified release checkpoint
        run: |
          python - <<'PY'
          from pathlib import Path
          from protcross.assets import DEFAULT_ASSET_BUNDLE, download_asset

          out = Path("/tmp/protcross-release-smoke/checkpoints")
          checkpoint = DEFAULT_ASSET_BUNDLE.assets[1]
          download_asset(checkpoint, out / checkpoint.filename, force=True, verify=True)
          PY

      - name: Check release checkpoint forward pass
        run: |
          PROTCROSS_RELEASE_SMOKE=1 \
          PROTCROSS_RELEASE_SYNTHETIC_SAMPLE=1 \
          PROTCROSS_RELEASE_CHECKPOINT=/tmp/protcross-release-smoke/checkpoints/protcross-0.1.2-binding-moad-final.ckpt \
          pytest -q tests/test_checkpoint_smoke.py

  desktop:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: desktop/frontend/package-lock.json

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Rust
        run: rustup toolchain install 1.88.0 --profile minimal

      - name: Install desktop backend test environment
        run: |
          python -m pip install --upgrade "pip==26.0.1"
          python -m pip install -c constraints/py310-ci.txt -e ".[predict,test]"
          python -m pip install -c constraints/py310-ci.txt --no-deps -e desktop/backend

      - name: Desktop backend tests
        run: pytest -q tests/desktop

      - name: Frontend build and audit
        working-directory: desktop/frontend
        run: |
          npm ci
          npm run build
          npm audit --omit=dev

      - name: Browser UI and accessibility tests
        working-directory: desktop/frontend
        run: |
          npx playwright install --with-deps chromium
          npm run test:ui

      - name: Tauri cargo check
        working-directory: desktop/src-tauri
        run: cargo +1.88.0 check --locked

  desktop-release-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Assert Apple Silicon macOS runner
        if: runner.os == 'macOS'
        shell: bash
        run: test "$(uname -m)" = "arm64"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: desktop/frontend/package-lock.json

      - uses: dtolnay/rust-toolchain@4e529fb27e59237866a6523e61ab248308c068b4 # 1.88.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"

      - name: Install desktop release build tooling
        run: |
          python -m pip install --upgrade "pip==26.0.1"
          python -m pip install -c constraints/py310-ci.txt build requests tqdm uv

      - name: Frontend dependencies
        working-directory: desktop/frontend
        run: npm ci

      - name: Build local ProtCross wheel for desktop runtime
        run: python -m build --wheel --outdir dist

      - name: Download desktop bundled assets
        shell: bash
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path

          sys.path.insert(0, "src")
          from protcross.assets import DEFAULT_ASSET_BUNDLE, download_asset

          targets = {
              "checkpoint": Path("checkpoints"),
              "pca": Path("data"),
          }
          for spec, out_dir in (
              (DEFAULT_ASSET_BUNDLE.assets[1], targets["checkpoint"]),
              (DEFAULT_ASSET_BUNDLE.assets[2], targets["pca"]),
          ):
              download_asset(spec, out_dir / spec.filename, force=True, verify=True)
          PY

      - name: Prepare desktop bundled assets (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\desktop\installer\prepare_bundled_assets.ps1

      - name: Prepare desktop bundled assets (macOS)
        if: runner.os == 'macOS'
        run: desktop/installer/prepare_bundled_assets.sh

      - name: Prepare desktop runtime bundle
        shell: bash
        run: |
          wheel="$(ls dist/protcross-*.whl | head -n 1)"
          python desktop/installer/prepare_runtime_wheelhouse.py \
            --runtime-dir desktop/runtime \
            --backend cpu \
            --local-protcross-wheel "$wheel"
          python desktop/installer/validate_runtime_bundle.py --runtime-dir desktop/runtime --backend cpu

      - name: Validate staged desktop sidecar resources
        shell: bash
        run: |
          python - <<'PY'
          import shutil
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "protcross-sidecar-resources"
          if root.exists():
              shutil.rmtree(root)
          root.mkdir(parents=True)
          shutil.copytree("desktop/backend", root / "backend", ignore=shutil.ignore_patterns("*.egg-info", "build", "dist", "__pycache__"))
          shutil.copytree("src", root / "python-src", ignore=shutil.ignore_patterns("*.egg-info", "__pycache__", "*.pyc"))
          shutil.copytree("desktop/runtime", root / "runtime", ignore=shutil.ignore_patterns("__pycache__"))
          shutil.copytree("desktop/bundled-assets", root / "bundled-assets")
          print(root)
          PY
          python desktop/installer/validate_packaged_sidecar.py \
            --resource-dir "$RUNNER_TEMP/protcross-sidecar-resources"

      - name: CPU backend offline install smoke (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\desktop\runtime\install_cpu_backend.ps1 -InstallRoot "$env:RUNNER_TEMP\protcross-runtime-smoke"
          .\desktop\runtime\test_backend.ps1 -Backend cpu -InstallRoot "$env:RUNNER_TEMP\protcross-runtime-smoke"

      - name: CPU backend offline install smoke (macOS)
        if: runner.os == 'macOS'
        run: |
          desktop/runtime/install_cpu_backend.sh --install-root "$RUNNER_TEMP/protcross-runtime-smoke"
          desktop/runtime/test_backend.sh --backend cpu --install-root "$RUNNER_TEMP/protcross-runtime-smoke"

      - name: Tauri Windows NSIS build smoke
        if: runner.os == 'Windows'
        working-directory: desktop/frontend
        run: npm run tauri:release-build -- --bundles nsis -- --locked

      - name: Validate packaged Windows installer resources
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path "desktop/src-tauri/target" -Filter "*.exe" -Recurse |
            Where-Object { $_.FullName -match "\\bundle\\nsis\\" } |
            Select-Object -First 1
          if ($null -eq $installer) {
            throw "NSIS installer not found after Tauri build."
          }
          .\desktop\installer\validate-release.ps1 `
            -InstallerPath $installer.FullName `
            -ValidateInstalledPackage `
            -SkipLocalBackendTests

      - name: Tauri macOS app build smoke
        if: runner.os == 'macOS'
        working-directory: desktop/frontend
        run: npm run tauri:release-build -- --bundles app -- --locked

      - name: Validate packaged macOS sidecar resources
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app_path="$(find desktop/src-tauri/target -path '*/bundle/macos/ProtCross Desktop.app' -print -quit)"
          if [[ -z "$app_path" ]]; then
            echo "Built .app bundle not found" >&2
            exit 1
          fi
          python desktop/installer/validate_packaged_sidecar.py \
            --resource-dir "$app_path/Contents/Resources"

      - name: Runtime installer syntax smoke (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          [scriptblock]::Create((Get-Content -Raw desktop/runtime/install_cpu_backend.ps1)) > $null
          [scriptblock]::Create((Get-Content -Raw desktop/runtime/install_gpu_backend.ps1)) > $null
          [scriptblock]::Create((Get-Content -Raw desktop/runtime/test_backend.ps1)) > $null
          [scriptblock]::Create((Get-Content -Raw desktop/installer/validate-release.ps1)) > $null

      - name: Runtime installer syntax smoke (macOS)
        if: runner.os == 'macOS'
        run: |
          bash -n desktop/runtime/install_cpu_backend.sh
          bash -n desktop/runtime/install_gpu_backend.sh
          bash -n desktop/runtime/test_backend.sh
          bash -n desktop/installer/sign-notarize-macos.sh
          bash -n desktop/installer/validate-release-macos.sh

name: Desktop Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create or update"
        required: true
        default: "v0.2.2"

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ inputs.tag }}
  cancel-in-progress: false

env:
  DESKTOP_VERSION: "0.2.2"

jobs:
  validate-input:
    name: Validate release tag and versions
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - name: Require the canonical 0.2.2 tag
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_TAG: ${{ inputs.tag }}
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          test "$RELEASE_TAG" = "v${DESKTOP_VERSION}" || {
            echo "Expected release tag v${DESKTOP_VERSION}, got $RELEASE_TAG" >&2
            exit 1
          }
          case "$WORKFLOW_REF" in
            "refs/heads/$DEFAULT_BRANCH"|"refs/tags/$RELEASE_TAG") ;;
            *)
              echo "Release workflow must run from $DEFAULT_BRANCH or $RELEASE_TAG, got $WORKFLOW_REF" >&2
              exit 1
              ;;
          esac
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA" || {
            echo "Checkout commit does not match workflow commit $GITHUB_SHA" >&2
            exit 1
          }
          git fetch --force --tags origin
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            tag_commit="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
            test "$tag_commit" = "$GITHUB_SHA" || {
              echo "Existing tag $RELEASE_TAG points to $tag_commit, not $GITHUB_SHA" >&2
              exit 1
            }
          fi
          python desktop/installer/validate_version_consistency.py --repo-root . --expected-version "$DESKTOP_VERSION"

  build-windows:
    name: Build unsigned Windows installer
    runs-on: windows-2022
    needs: validate-input
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Verify Windows build commit and existing tag
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch --force --tags origin
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            test "$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")" = "$GITHUB_SHA"
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: desktop/frontend/package-lock.json

      - uses: dtolnay/rust-toolchain@4e529fb27e59237866a6523e61ab248308c068b4 # 1.88.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"

      - name: Install desktop release build tooling
        run: |
          python -m pip install --upgrade "pip==26.0.1"
          python -m pip install -c constraints/py310-ci.txt build requests tqdm uv

      - name: Frontend dependencies
        working-directory: desktop/frontend
        run: npm ci

      - name: Build local ProtCross wheel for desktop runtime
        run: python -m build --wheel --outdir dist

      - name: Download desktop bundled assets
        shell: bash
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path

          sys.path.insert(0, "src")
          from protcross.assets import DEFAULT_ASSET_BUNDLE, download_asset

          for spec, out_dir in (
              (DEFAULT_ASSET_BUNDLE.assets[1], Path("checkpoints")),
              (DEFAULT_ASSET_BUNDLE.assets[2], Path("data")),
          ):
              download_asset(spec, out_dir / spec.filename, force=True, verify=True)
          PY

      - name: Prepare desktop bundled assets
        shell: pwsh
        run: .\desktop\installer\prepare_bundled_assets.ps1

      - name: Prepare desktop runtime bundle
        shell: bash
        run: |
          wheel="$(ls dist/protcross-*.whl | head -n 1)"
          python desktop/installer/prepare_runtime_wheelhouse.py \
            --runtime-dir desktop/runtime \
            --backend cpu \
            --local-protcross-wheel "$wheel"
          python desktop/installer/validate_runtime_bundle.py --runtime-dir desktop/runtime --backend cpu

      - name: Build unsigned NSIS installer
        working-directory: desktop/frontend
        run: npm run tauri:release-build -- --bundles nsis -- --locked

      - name: Validate unsigned Windows installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path "desktop/src-tauri/target" -Filter "*.exe" -Recurse |
            Where-Object { $_.FullName -match "\\bundle\\nsis\\" } |
            Select-Object -First 1
          if ($null -eq $installer) {
            throw "NSIS installer not found after Tauri build."
          }
          .\desktop\installer\validate-release.ps1 `
            -InstallerPath $installer.FullName `
            -ValidateInstalledPackage `
            -SkipLocalBackendTests
          New-Item -ItemType Directory -Force -Path "release-assets" | Out-Null
          Copy-Item $installer.FullName "release-assets\ProtCross_Desktop_${env:DESKTOP_VERSION}_x64-setup.exe" -Force

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: protcross-desktop-windows
          path: release-assets/*
          if-no-files-found: error

  build-macos:
    name: Build unsigned macOS Apple Silicon DMG
    runs-on: macos-15
    needs: validate-input
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Verify macOS build commit and existing tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch --force --tags origin
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            test "$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")" = "$GITHUB_SHA"
          fi

      - name: Assert Apple Silicon release runner
        run: test "$(uname -m)" = "arm64"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: desktop/frontend/package-lock.json

      - uses: dtolnay/rust-toolchain@4e529fb27e59237866a6523e61ab248308c068b4 # 1.88.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"

      - name: Install desktop release build tooling
        run: |
          python -m pip install --upgrade "pip==26.0.1"
          python -m pip install -c constraints/py310-ci.txt build requests tqdm uv

      - name: Frontend dependencies
        working-directory: desktop/frontend
        run: npm ci

      - name: Build local ProtCross wheel for desktop runtime
        run: python -m build --wheel --outdir dist

      - name: Download desktop bundled assets
        shell: bash
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path

          sys.path.insert(0, "src")
          from protcross.assets import DEFAULT_ASSET_BUNDLE, download_asset

          for spec, out_dir in (
              (DEFAULT_ASSET_BUNDLE.assets[1], Path("checkpoints")),
              (DEFAULT_ASSET_BUNDLE.assets[2], Path("data")),
          ):
              download_asset(spec, out_dir / spec.filename, force=True, verify=True)
          PY

      - name: Prepare desktop bundled assets
        run: desktop/installer/prepare_bundled_assets.sh

      - name: Prepare desktop runtime bundle
        shell: bash
        run: |
          wheel="$(ls dist/protcross-*.whl | head -n 1)"
          python desktop/installer/prepare_runtime_wheelhouse.py \
            --runtime-dir desktop/runtime \
            --backend cpu \
            --local-protcross-wheel "$wheel"
          python desktop/installer/validate_runtime_bundle.py --runtime-dir desktop/runtime --backend cpu

      - name: Build unsigned DMG
        working-directory: desktop/frontend
        run: npm run tauri:release-build -- --bundles dmg -- --locked

      - name: Validate packaged macOS sidecar resources
        shell: bash
        run: |
          dmg_path="$(find desktop/src-tauri/target -path '*/bundle/dmg/*.dmg' -print -quit)"
          if [[ -z "$dmg_path" ]]; then
            echo "DMG not found after Tauri build." >&2
            exit 1
          fi
          mount_dir="$(mktemp -d)"
          cleanup_mount() {
            hdiutil detach "$mount_dir" >/dev/null 2>&1 || true
            rmdir "$mount_dir" >/dev/null 2>&1 || true
          }
          trap cleanup_mount EXIT
          hdiutil attach "$dmg_path" -nobrowse -readonly -mountpoint "$mount_dir" >/dev/null
          app_path="$(find "$mount_dir" -maxdepth 1 -name '*.app' -print -quit)"
          if [[ -z "$app_path" ]]; then
            echo "No .app bundle found inside DMG: $dmg_path" >&2
            exit 1
          fi
          python desktop/installer/validate_packaged_sidecar.py \
            --resource-dir "$app_path/Contents/Resources"

      - name: Stage unsigned Apple Silicon DMG
        shell: bash
        run: |
          dmg_path="$(find desktop/src-tauri/target -path '*/bundle/dmg/*.dmg' -print -quit)"
          if [[ -z "$dmg_path" ]]; then
            echo "DMG not found after Tauri build." >&2
            exit 1
          fi
          mkdir -p release-assets
          cp "$dmg_path" "release-assets/ProtCross_Desktop_${DESKTOP_VERSION}_macos-aarch64.dmg"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: protcross-desktop-macos
          path: release-assets/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    needs:
      - build-windows
      - build-macos
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Verify publish commit and existing tag
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch --force --tags origin
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            tag_commit="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
            test "$tag_commit" = "$GITHUB_SHA" || {
              echo "Refusing to publish: $RELEASE_TAG points to $tag_commit, not $GITHUB_SHA" >&2
              exit 1
            }
          fi

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: downloaded-assets

      - name: Prepare release assets and notes
        run: |
          mkdir -p release-assets
          find downloaded-assets -type f \( -name "*.exe" -o -name "*.dmg" \) -exec cp {} release-assets/ \;
          test -f "release-assets/ProtCross_Desktop_${DESKTOP_VERSION}_x64-setup.exe"
          test -f "release-assets/ProtCross_Desktop_${DESKTOP_VERSION}_macos-aarch64.dmg"
          (cd release-assets && sha256sum * > SHA256SUMS.txt)
          cat > release-notes.txt <<'NOTES'
          # ProtCross Desktop 0.2.2

          Windows and macOS desktop packages are currently unsigned. Windows SmartScreen and macOS Gatekeeper may display a warning during installation.

          ## Downloads

          - Windows 10/11 x64: `ProtCross_Desktop_0.2.2_x64-setup.exe`
          - macOS 12+ on Apple Silicon (arm64): `ProtCross_Desktop_0.2.2_macos-aarch64.dmg`
          - Checksums: `SHA256SUMS.txt`

          ## What is included

          - Tauri + React desktop interface.
          - Mol* protein viewer with predicted-residue cluster selection, score-weighted Cα centroids, and residue tables.
          - Local CPU prediction backend setup flow.
          - Optional GPU or existing conda backend detection path.
          - Bundled ProtCross checkpoint/PCA assets from the stable `0.1.2` asset bundle.

          ESM-C weights are not bundled. Users must confirm the ESM-C license in the app and then download or import the ESM-C weights separately.
          NOTES
          ls -lh release-assets

      - name: Create or update GitHub release
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --title "ProtCross Desktop ${DESKTOP_VERSION}" \
              --notes-file release-notes.txt \
              --latest
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --target "$GITHUB_SHA" \
              --title "ProtCross Desktop ${DESKTOP_VERSION}" \
              --notes-file release-notes.txt \
              --latest
            exit 0
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber

      - name: Verify published tag target
        run: |
          git fetch --force origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          tag_commit="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          test "$tag_commit" = "$GITHUB_SHA" || {
            echo "Published tag $RELEASE_TAG points to $tag_commit, not $GITHUB_SHA" >&2
            exit 1
          }

version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      compatible-actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      compatible-python:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
      - dependency-name: torch
      - dependency-name: torchvision
      - dependency-name: torchtext

  - package-ecosystem: npm
    directory: "/desktop/frontend"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      compatible-frontend:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
      - dependency-name: react
        versions:
          - ">=19"
      - dependency-name: react-dom
        versions:
          - ">=19"
      - dependency-name: "@types/react"
        versions:
          - ">=19"
      - dependency-name: "@types/react-dom"
        versions:
          - ">=19"
      - dependency-name: molstar
        versions:
          - ">=5"
      - dependency-name: vite
        versions:
          - ">=7"
      - dependency-name: "@vitejs/plugin-react"
        versions:
          - ">=5"

  - package-ecosystem: cargo
    directory: "/desktop/src-tauri"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      compatible-rust:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
      - dependency-name: getrandom
        versions:
          - ">=0.3"
